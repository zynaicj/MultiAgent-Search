<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiAgent Search · 多轮智能对话</title>
<style>
:root{color-scheme:dark;--bg:#0f1117;--panel:#191c27;--card:#252938;--line:#353a4c;--text:#edf0f7;--muted:#9aa3b8;--accent:#7775ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit}button{border:0;cursor:pointer;border-radius:8px;padding:9px 12px;color:var(--text);background:var(--card)}button:hover{filter:brightness(1.2)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);color:white}
.layout{height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr) 260px}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line);padding:16px}.right{border-right:0;border-left:1px solid var(--line)}
h2{font-size:16px;margin:0 0 16px}.side-list{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.conversation{width:100%;text-align:left;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation.active{background:#353957}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}main{display:flex;flex-direction:column;min-width:0}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#chat{padding:26px max(20px,calc((100% - 850px)/2));flex:1;overflow:auto}.bubble{margin:14px 0;max-width:90%;padding:14px 17px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel)}.bubble.user{margin-left:auto;background:#34376d}.bubble.assistant{margin-right:auto}.role{font-size:11px;color:var(--muted);margin-bottom:5px}.composer{border-top:1px solid var(--line);padding:15px 20px}.composer textarea{width:100%;min-height:65px;resize:vertical;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px;border-radius:10px;outline:none}
.composer .row{justify-content:space-between;margin-top:8px}.muted{color:var(--muted);font-size:12px}.event{border-bottom:1px solid var(--line);padding:9px 0;font-size:12px;overflow-wrap:anywhere}.file{padding:8px 0;border-bottom:1px solid var(--line)}a{color:#b5b8ff}
@media(max-width:900px){.layout{grid-template-columns:200px minmax(0,1fr)}.right{display:none}}@media(max-width:600px){.layout{grid-template-columns:1fr}aside.left{height:130px;border-bottom:1px solid var(--line);border-right:0}.layout{display:flex;flex-direction:column}aside.left .side-list{flex-direction:row;overflow:auto}main{flex:1;min-height:0}}
</style></head><body>
<div class="layout">
<aside class="left"><h2>🤖 MultiAgent Search</h2><button class="primary" style="width:100%" onclick="newChat()">＋ 新建聊天</button><div id="conversations" class="side-list"></div></aside>
<main><header><div><strong id="chatTitle">新聊天</strong><div class="muted" id="status">就绪</div></div><div class="row"><button onclick="renameChat()">重命名</button><button onclick="deleteChat()">删除聊天</button></div></header>
<div id="chat"><p class="muted">选择或新建聊天，Agent 会自动记住同一聊天中的上下文。</p></div>
<div class="composer"><textarea id="query" placeholder="输入问题，Shift+Enter 换行，Enter 发送"></textarea><div class="row"><span class="muted">支持多轮提问，生成文件保存在当前会话目录</span><div class="row"><input id="upload" type="file" multiple hidden><button onclick="document.getElementById('upload').click()">上传文件</button><button class="primary" id="send" onclick="sendMessage()">发送</button></div></div></div>
</main>
<aside class="right"><h2>Agent 执行日志</h2><div id="logs" class="muted"></div><h2 style="margin-top:25px">生成文件</h2><button onclick="loadFiles()">刷新文件</button><div id="files"></div></aside>
</div>
<script>
let active=null,ws=null,busy=false,dir=null;const $=s=>document.querySelector(s);
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,options={}){const r=await fetch(path,options);const j=await r.json();if(!r.ok)throw Error(j.detail||r.statusText);return j}
function json(method,body){return {method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}}
function setBusy(b){busy=b;$('#send').disabled=b;$('#status').textContent=b?'Agent 正在处理…':'就绪'}
function bubble(role,text){const e=document.createElement('div');e.className='bubble '+role;e.innerHTML='<div class="role">'+(role==='user'?'你':'Agent')+'</div><div>'+escapeHtml(text)+'</div>';$('#chat').appendChild(e);$('#chat').scrollTop=$('#chat').scrollHeight}
async function refreshChats(){try{const data=await api('/api/conversations');$('#conversations').innerHTML=data.conversations.map(c=>'<div class="row"><button class="conversation '+(active===c.id?'active':'')+'" data-id="'+escapeHtml(c.id)+'">'+escapeHtml(c.title)+'</button></div>').join('');document.querySelectorAll('.conversation').forEach(b=>b.onclick=()=>switchChat(b.dataset.id));}catch(e){$('#status').textContent=e.message}}
async function newChat(){if(busy)return alert('等待当前回复完成');const c=await api('/api/conversations',{method:'POST'});await switchChat(c.id)}
async function switchChat(id){if(busy&&active!==id)return alert('请等待当前回复完成');if(ws){ws.close();ws=null}active=id;dir=null;$('#logs').innerHTML='';$('#files').innerHTML='';const d=await api('/api/conversations/'+encodeURIComponent(id)+'/messages');$('#chat').innerHTML='';d.messages.forEach(m=>bubble(m.role,m.content));const all=await api('/api/conversations');$('#chatTitle').textContent=all.conversations.find(c=>c.id===id)?.title||'聊天';await refreshChats();connect(id)}
function connect(id){return new Promise((resolve,reject)=>{const protocol=location.protocol==='https:'?'wss:':'ws:';const socket=new WebSocket(protocol+'//'+location.host+'/ws/'+encodeURIComponent(id));ws=socket;let done=false;socket.onopen=()=>{done=true;resolve()};socket.onerror=()=>{if(!done)reject(Error('WebSocket 连接失败'))};socket.onclose=()=>{if(ws===socket)ws=null};socket.onmessage=event=>{let d;try{d=JSON.parse(event.data)}catch{return}if(d.type!=='monitor_event'||active!==id)return;const log=document.createElement('div');log.className='event';log.textContent='['+d.event+'] '+d.message;$('#logs').prepend(log);if(d.event==='session_created'){dir=d.data?.path;loadFiles()}if(d.event==='task_result'){bubble('assistant',d.data?.result||d.message);setBusy(false);refreshChats();loadFiles()}if(d.event==='error'){bubble('assistant','执行失败：'+d.message);setBusy(false);refreshChats()}}})}
async function sendMessage(){let text=$('#query').value.trim();if(!text||busy)return;try{if(!active)await newChat();if(!ws||ws.readyState!==1)await connect(active);setBusy(true);const id=active;bubble('user',text);$('#query').value='';await api('/api/task',json('POST',{query:text,thread_id:id}));await refreshChats();const all=await api('/api/conversations');$('#chatTitle').textContent=all.conversations.find(c=>c.id===id)?.title||'聊天'}catch(e){setBusy(false);bubble('assistant','提交失败：'+e.message)}}
async function renameChat(){if(!active)return;let title=prompt('聊天名称');if(!title?.trim())return;await api('/api/conversations/'+encodeURIComponent(active),json('PATCH',{title:title.trim()}));$('#chatTitle').textContent=title;refreshChats()}
async function deleteChat(){if(!active||busy)return;if(!confirm('确定删除当前会话及其记忆吗？'))return;await api('/api/conversations/'+encodeURIComponent(active),{method:'DELETE'});if(ws)ws.close();active=null;$('#chat').innerHTML='';$('#chatTitle').textContent='新聊天';$('#files').innerHTML='';$('#logs').innerHTML='';refreshChats()}
async function loadFiles(){if(!dir)return;try{const data=await api('/api/files?path='+encodeURIComponent(dir));$('#files').innerHTML=(data.files||[]).map(f=>'<div class="file">'+escapeHtml(f.name)+' <a href="/api/download?path='+encodeURIComponent(f.path)+'">下载</a></div>').join('')}catch(e){console.warn(e)}}
$('#query').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
$('#upload').addEventListener('change',async e=>{if(!active)await newChat();const files=Array.from(e.target.files);if(!files.length)return;const fd=new FormData();files.forEach(f=>fd.append('files',f));fd.append('thread_id',active);try{const r=await fetch('/api/upload',{method:'POST',body:fd});if(!r.ok)throw Error('上传失败');alert('已上传 '+files.length+' 个文件')}catch(err){alert(err.message)}e.target.value=''});
(async()=>{await refreshChats();const d=await api('/api/conversations');if(d.conversations.length)await switchChat(d.conversations[0].id)})().catch(e=>{$('#status').textContent=e.message});
</script></body></html>
