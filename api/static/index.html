<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiAgent-Search · 连续智能对话</title>
<style>
:root{color-scheme:dark;--bg:#101218;--panel:#191c27;--card:#262b3a;--line:#34394b;--fg:#e7eaf3;--sub:#a0a8bd;--accent:#7472ed;--warn:#d9a13b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}button,select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button:hover:not(:disabled){filter:brightness(1.15)}button:disabled{opacity:.42;cursor:default}.primary{background:var(--accent);border-color:transparent}.danger{color:#ffb2ad}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr) 315px;height:100dvh}
aside{overflow:auto;background:var(--panel);padding:16px;border-right:1px solid var(--line)}aside.right{border-left:1px solid var(--line);border-right:0}
h2{font-size:15px;margin:0 0 14px}.muted{color:var(--sub);font-size:12px}label{color:var(--sub);font-size:12px}
#chats{display:flex;flex-direction:column;gap:5px;margin-top:15px}.chatItem{text-align:left;width:100%;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatItem.active{background:#343855}.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}
main{display:flex;flex-direction:column;min-width:0}header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
#messages{flex:1;overflow:auto;padding:22px max(20px,calc((100% - 800px)/2))}
.message{max-width:92%;background:var(--panel);border-radius:12px;padding:13px 16px;margin-bottom:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user{margin-left:auto;background:#34386c}.message .role{font-size:11px;color:var(--sub);margin-bottom:5px}
.composer{padding:14px 20px;border-top:1px solid var(--line)}textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;outline:0;color:var(--fg);padding:12px;width:100%;min-height:75px;resize:vertical}
.composer .row{justify-content:space-between;flex-wrap:wrap;margin-top:8px}
#logs{max-height:48vh;overflow:auto}.event{border-bottom:1px solid var(--line);padding:8px 0;color:var(--sub);font-size:12px;overflow-wrap:anywhere}
#files .file{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:12px;overflow-wrap:anywhere}
a{color:#b5b5ff}.statusTag{padding:3px 7px;border:1px solid var(--line);border-radius:20px;font-size:11px;color:var(--sub)}
#approval{border:1px solid var(--warn);border-radius:12px;padding:12px;margin:12px 0;display:none}#approval pre{white-space:pre-wrap;word-break:break-word;font-size:11px}
#notify{color:var(--warn);font-size:12px}select{max-width:100%}
@media(max-width:1050px){.layout{grid-template-columns:210px minmax(0,1fr)}aside.right{display:none}}
@media(max-width:620px){.layout{display:flex;flex-direction:column}aside.left{height:122px;flex-shrink:0;border-bottom:1px solid var(--line)}#chats{flex-direction:row;overflow:auto;margin-top:8px}.chatItem{width:auto;max-width:170px;flex-shrink:0}main{flex:1;min-height:0}}
</style>
</head>
<body>
<div class="layout">
<aside class="left">
<h2>🤖 MultiAgent Search</h2>
<div class="row"><select id="newMode" aria-label="新聊天模式" class="grow"><option value="deep_agent">DeepAgents 智能模式</option><option value="collaboration">多 Agent 协作模式</option></select><button class="primary" onclick="newChat()">＋</button></div>
<div class="muted" style="margin-top:8px">新建聊天时选择模式，会话内不切换</div>
<div id="chats"></div>
</aside>
<main>
<header>
<div class="grow"><strong id="title">新聊天</strong><div id="status" class="muted">请选择或创建聊天</div></div>
<div class="row"><button onclick="renameChat()">重命名</button><button onclick="deleteChat()" class="danger">删除</button></div>
</header>
<div id="messages"><p class="muted">在左侧新建聊天。同一会话可以持续追问，也可以使用上一轮生成的文件。</p></div>
<div id="approval"><strong>等待人工审批</strong><div id="approvalText" class="muted"></div><pre id="approvalArgs"></pre><div class="row"><button class="primary" onclick="decide('approve')">批准</button><button onclick="decide('reject')">拒绝</button></div></div>
<div class="composer">
<textarea id="query" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
<div class="row"><span id="notify" class="grow"> </span><input id="upload" type="file" multiple hidden><button onclick="document.getElementById('upload').click()">上传文件</button><button class="primary" id="send" onclick="sendMessage()">发送 <span aria-hidden="true">↗</span></button></div>
</div>
</main>
<aside class="right">
<h2>Agent 执行日志</h2><div id="logs"></div>
<h2 style="margin-top:22px">生成文件</h2><button onclick="loadFiles()">刷新</button><div id="files"></div>
</aside>
</div>
<script>
const $=s=>document.querySelector(s);
let active=null,socket=null,conversation=null,approvalRun=null,seenEvents=new Set(),retryTimer=null;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const request=async(path,options={})=>{const r=await fetch(path,options);const j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail||r.statusText));return j};
const json=(method,data)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
const urlId=id=>encodeURIComponent(id);
const busy=()=>conversation&&['running','waiting_approval'].includes(conversation.status);
function notify(msg){$('#notify').textContent=msg||''}
function updateHeader(){
 $('#title').textContent=conversation?.title||'新聊天';
 const status=conversation?.status||'idle';
 $('#status').textContent=(conversation?.mode==='collaboration'?'多 Agent 协作':'DeepAgents 智能')+' · '+({running:'执行中',waiting_approval:'等待人工审批',idle:'就绪'}[status]||status);
 $('#send').disabled=!conversation||busy();
}
function bubble(role,content){const div=document.createElement('div');div.className='message '+role;div.innerHTML='<div class="role">'+(role==='user'?'你':'Agent')+'</div>'+escapeHtml(content);$('#messages').appendChild(div);$('#messages').scrollTop=$('#messages').scrollHeight}
async function loadMessages(id=active){if(!id)return;const d=await request('/api/conversations/'+urlId(id)+'/messages');if(id!==active)return;$('#messages').innerHTML='';d.messages.forEach(m=>bubble(m.role,m.content));}
async function refreshChats(){const d=await request('/api/conversations');$('#chats').innerHTML=d.conversations.map(c=>'<button class="chatItem '+(c.id===active?'active':'')+'" data-id="'+escapeHtml(c.id)+'">'+escapeHtml(c.title)+' <span class="muted">· '+(c.mode==='collaboration'?'协作':'Deep')+'</span></button>').join('');document.querySelectorAll('.chatItem').forEach(el=>el.onclick=()=>switchChat(el.dataset.id))}
function appendEvent(ev){
 if(ev.event_id&&seenEvents.has(ev.event_id))return;
 if(ev.event_id)seenEvents.add(ev.event_id);
 const el=document.createElement('div');el.className='event';el.textContent='['+ev.event+'] '+ev.message;$('#logs').appendChild(el);$('#logs').scrollTop=$('#logs').scrollHeight;
 if(ev.event==='task_result'||ev.event==='error'||ev.event==='run_status'){refreshCurrent().catch(console.error);}
 if(ev.event==='session_created'||ev.event==='task_result'){loadFiles().catch(console.error);}
}
async function loadEvents(id=active){if(!id)return;let after=0,round=0;while(round++<20){const r=await request('/api/conversations/'+urlId(id)+'/events?after='+after+'&limit=300');if(id!==active)return;r.events.forEach(e=>appendEvent({...e,event_id:e.id}));if(r.events.length<300)break;after=r.events[r.events.length-1].id}}
async function refreshCurrent(){
 if(!active)return;const id=active;
 const c=await request('/api/conversations/'+urlId(id));if(active!==id)return;
 const changed=conversation?.status!==c.status;conversation=c;updateHeader();
 if(changed||!busy()){await loadMessages(id);await refreshChats();}
 await showApproval();
}
async function showApproval(){
 approvalRun=null;$('#approval').style.display='none';
 if(!active||conversation?.status!=='waiting_approval'||!conversation.current_run_id)return;
 const run=await request('/api/runs/'+urlId(conversation.current_run_id));if(!active||run.conversation_id!==active)return;
 let details={};try{details=JSON.parse(run.approval_json||'{}')}catch{}
 approvalRun=run.id;
 $('#approvalText').textContent=(details.tool_name||'工具')+' · '+(details.operation||'高风险操作')+' · '+(details.reason||'');
 $('#approvalArgs').textContent=JSON.stringify(details.args||{},null,2);
 $('#approval').style.display='block';
}
async function decide(decision){
 if(!approvalRun)return;
 const rid=approvalRun;approvalRun=null;$('#approval').style.display='none';notify('正在提交审批决定…');
 try{await request('/api/runs/'+urlId(rid)+'/approval',json('POST',{decision}));notify('审批已提交，Agent 正在恢复');await refreshCurrent();}
 catch(e){notify(e.message);await refreshCurrent()}
}
async function connect(id){
 if(socket){socket.onclose=null;socket.close();socket=null}
 const protocol=location.protocol==='https:'?'wss:':'ws:';
 return new Promise((resolve,reject)=>{
   const ws=new WebSocket(protocol+'//'+location.host+'/ws/'+urlId(id));socket=ws;
   let confirmed=false;
   const timeout=setTimeout(()=>{if(!confirmed){ws.close();reject(Error('WebSocket 准备超时'))}},6500);
   ws.onmessage=event=>{
     let d;try{d=JSON.parse(event.data)}catch{return}
     if(d.type==='ws_ready'){confirmed=true;clearTimeout(timeout);resolve();return}
     if(d.type==='monitor_event'&&active===id)appendEvent(d);
   };
   ws.onerror=()=>{if(!confirmed){clearTimeout(timeout);reject(Error('WebSocket 连接失败'))}};
   ws.onclose=()=>{if(socket!==ws)return;socket=null;if(!confirmed){clearTimeout(timeout);reject(Error('WebSocket 已断开'))}else if(active===id){setTimeout(()=>{if(active===id)connect(id).then(()=>loadEvents(id)).catch(console.warn)},1800)}};
 });
}
async function switchChat(id){
 clearTimeout(retryTimer);retryTimer=null;
 active=id;seenEvents.clear();$('#logs').innerHTML='';$('#files').innerHTML='';notify('');
 conversation=await request('/api/conversations/'+urlId(id));
 updateHeader();await loadMessages(id);await refreshChats();
 try{await connect(id);await loadEvents(id)}catch(e){notify('WebSocket 未连接：'+e.message)}
 await loadFiles();await showApproval();
}
async function newChat(){
 try{const mode=$('#newMode').value;const c=await request('/api/conversations',json('POST',{mode,title:'新聊天'}));await switchChat(c.id)}
 catch(e){notify(e.message)}
}
async function sendMessage(){
 const text=$('#query').value.trim();if(!text)return;
 try{
  if(!active)await newChat();
  if(busy()){notify('当前会话正在执行或等待审批');return}
  if(!socket||socket.readyState!==1)await connect(active);
  const id=active;
  const key=crypto.randomUUID();
  const result=await request('/api/conversations/'+urlId(id)+'/messages',json('POST',{query:text,client_message_id:key}));
  $('#query').value='';notify('已提交，任务 ID：'+result.run_id.slice(0,8));
  await refreshCurrent();
  if(active===id)await loadMessages(id);
 }catch(e){notify('发送失败：'+e.message)}
}
async function renameChat(){
 if(!active)return;const title=prompt('聊天名称',conversation?.title||'');if(!title?.trim())return;
 try{conversation=await request('/api/conversations/'+urlId(active),json('PATCH',{title:title.trim()}));updateHeader();await refreshChats()}catch(e){notify(e.message)}
}
async function deleteChat(){
 if(!active||busy())return;
 if(!confirm('删除当前聊天及其消息、生成文件和 Checkpoint？长期用户记忆不会删除。'))return;
 try{
   await request('/api/conversations/'+urlId(active),{method:'DELETE'});
   if(socket){socket.onclose=null;socket.close();socket=null}
   active=null;conversation=null;$('#messages').innerHTML='';$('#files').innerHTML='';$('#logs').innerHTML='';updateHeader();await refreshChats();
 }catch(e){notify(e.message)}
}
async function loadFiles(){
 if(!active)return;const id=active;const d=await request('/api/conversations/'+urlId(id)+'/files');
 if(id!==active)return;
 $('#files').innerHTML=d.files.map(f=>{
 const safePath=f.name.split('/').map(encodeURIComponent).join('/');
 return '<div class="file"><span>'+escapeHtml(f.name)+'</span><a href="/api/conversations/'+urlId(id)+'/files/'+safePath+'">下载</a></div>';
 }).join('');
}
$('#query').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
$('#upload').addEventListener('change',async e=>{
 const files=Array.from(e.target.files);if(!files.length)return;
 try{if(!active)await newChat();if(busy())throw Error('请等待当前任务完成');
 const data=new FormData();files.forEach(f=>data.append('files',f));data.append('thread_id',active);
 const r=await fetch('/api/upload',{method:'POST',body:data});if(!r.ok)throw Error('文件上传失败');
 notify('已上传 '+files.length+' 个文件，下轮提问时 Agent 可读取。');
 }catch(err){notify(err.message)}e.target.value='';
});
setInterval(()=>{if(active&&conversation?.status==='running')refreshCurrent().catch(console.warn)},2500);
(async()=>{await refreshChats();const d=await request('/api/conversations');if(d.conversations.length)await switchChat(d.conversations[0].id);else await newChat()})().catch(e=>notify(e.message));
</script>
</body>
</html>
